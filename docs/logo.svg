<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="400" height="160" rx="24" fill="url(#bg)" />

  <!-- Moss tuft: cluster of rounded leaf shapes -->
  <ellipse cx="52" cy="105" rx="16" ry="28" fill="#52b788" transform="rotate(-20 52 105)" />
  <ellipse cx="70" cy="95" rx="14" ry="30" fill="#40916c" transform="rotate(-5 70 95)" />
  <ellipse cx="88" cy="100" rx="15" ry="26" fill="#52b788" transform="rotate(15 88 100)" />
  <ellipse cx="60" cy="115" rx="18" ry="14" fill="#2d6a4f" />
  <ellipse cx="78" cy="118" rx="16" ry="12" fill="#1b4332" />

  <!-- Small dewdrop -->
  <circle cx="71" cy="72" r="5" fill="#d8f3dc" opacity="0.7" />
  <circle cx="69" cy="70" r="2" fill="white" opacity="0.5" />

  <!-- Language name -->
  <text
    x="118"
    y="103"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="-2"
    fill="#d8f3dc"
  >moss</text>

  <!-- Tagline -->
  <text
    x="120"
    y="128"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14"
    font-weight="400"
    letter-spacing="3"
    fill="#95d5b2"
    opacity="0.85"
  >grow something beautiful</text>
</svg>
